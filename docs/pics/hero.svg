<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#eef0f6"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#007aff"/>
      <stop offset="100%" stop-color="#34c759"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bg)"/>

  <!-- Decorative grid dots -->
  <g opacity="0.06" fill="#007aff">
    <circle cx="40" cy="40" r="3"/><circle cx="80" cy="40" r="3"/><circle cx="120" cy="40" r="3"/>
    <circle cx="40" cy="80" r="3"/><circle cx="80" cy="80" r="3"/><circle cx="120" cy="80" r="3"/>
    <circle cx="1080" cy="300" r="3"/><circle cx="1120" cy="300" r="3"/><circle cx="1160" cy="300" r="3"/>
    <circle cx="1080" cy="340" r="3"/><circle cx="1120" cy="340" r="3"/><circle cx="1160" cy="340" r="3"/>
    <circle cx="1080" cy="320" r="3"/><circle cx="1120" cy="320" r="3"/><circle cx="1160" cy="320" r="3"/>
    <circle cx="40" cy="60" r="3"/><circle cx="40" cy="100" r="3"/><circle cx="40" cy="120" r="3"/>
  </g>

  <!-- Accent arc -->
  <path d="M900 320 Q1050 280 1100 180 Q1140 100 1080 40" stroke="url(#accent-line)" stroke-width="2" fill="none" opacity="0.25" stroke-linecap="round"/>
  <path d="M920 330 Q1070 290 1120 190 Q1155 115 1100 55" stroke="#007aff" stroke-width="1.2" fill="none" opacity="0.12" stroke-linecap="round"/>

  <!-- Floating coin shapes -->
  <circle cx="950" cy="120" r="32" fill="#ff9500" opacity="0.13"/>
  <circle cx="950" cy="120" r="20" fill="none" stroke="#ff9500" stroke-width="1.5" opacity="0.3"/>
  <text x="950" y="127" text-anchor="middle" font-size="20" fill="#ff9500" opacity="0.4" font-family="system-ui,sans-serif" font-weight="700">₹</text>

  <circle cx="1040" cy="220" r="22" fill="#34c759" opacity="0.13"/>
  <circle cx="1040" cy="220" r="13" fill="none" stroke="#34c759" stroke-width="1.2" opacity="0.3"/>

  <circle cx="870" cy="200" r="16" fill="#5856d6" opacity="0.12"/>
  <circle cx="870" cy="200" r="9" fill="none" stroke="#5856d6" stroke-width="1" opacity="0.28"/>

  <!-- Bar chart decoration -->
  <g transform="translate(880, 260)" opacity="0.2">
    <rect x="0" y="30" width="16" height="30" rx="3" fill="#007aff"/>
    <rect x="22" y="15" width="16" height="45" rx="3" fill="#007aff"/>
    <rect x="44" y="0" width="16" height="60" rx="3" fill="#007aff"/>
    <rect x="66" y="20" width="16" height="40" rx="3" fill="#007aff"/>
  </g>

  <!-- Main content -->
  <text x="80" y="150" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="56" font-weight="800" fill="#1d1d1f">Stash</text>

  <text x="82" y="210" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="500" fill="#6e6e73">A local-first personal expense tracker</text>

  <!-- Accent underline -->
  <rect x="82" y="230" width="120" height="4" rx="2" fill="url(#accent-line)" opacity="0.7"/>

  <text x="82" y="280" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="400" fill="#86868b">Record spending in seconds. Understand your habits.</text>
  <text x="82" y="305" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="400" fill="#86868b">No accounts. No cloud. Your data stays on your device.</text>
</svg>
